# nginx-конфиг сайта jnnfactory.online (каноническая копия с VPS).
#
# Живой путь на сервере: /etc/nginx/sites-available/all_jnn.conf
# (символическая ссылка из /etc/nginx/sites-enabled/all_jnn.conf).
# Применение: nginx -t && systemctl reload nginx
#
# Что важно в этом конфиге:
#   * try_files $uri $uri.html $uri/ =404  — ЧПУ без расширения (/catalog -> catalog.html)
#     и настоящий 404 вместо отдачи главной на любой путь (был soft-404);
#   * error_page 404 /404.html — своя страница «Страница не найдена»;
#   * запрет отдачи служебных каталогов (_scripts, scripts, backups, venv, reports,
#     content, node_modules, screenshots) и скрытых файлов (.git и т.п.) —
#     раньше публично скачивался резервный архив сайта на 52 МБ;
#   * проксирование публичного чтения Directus: /api/items/ -> 127.0.0.1:8055;
#   * /assets/ отдаётся с длинным кэшем.

server {
    listen 443 ssl;
    server_name jnnfactory.online www.jnnfactory.online;
    ssl_certificate /etc/letsencrypt/live/jnnfactory.online-0002/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jnnfactory.online-0002/privkey.pem; # managed by Certbot

    root /var/www/jnnfactory;

    # Быстрый переход в CMS
    location = /admin {
        return 301 https://admin.jnnfactory.online;
    }
    location = /admin/ {
        return 301 https://admin.jnnfactory.online;
    }

    index index.html;

    # Directus API proxy (public read)
    location ^~ /api/items/ {
        proxy_pass http://127.0.0.1:8055/items/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JNN Stock API Proxy
    location ^~ /api/stock/ {
        proxy_pass http://127.0.0.1:8095/api/v1/stock/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кастомная страница 404
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Служебные каталоги и скрытые файлы наружу не отдаём
    location ~ /\.(?!well-known) { return 404; }
    location ~* ^/(_scripts|scripts|backups|venv|reports|content|node_modules|screenshots)/ { return 404; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ ^/(media|pages|edit|save|settings|api)(\?.*)?$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }

    location /assets/ {
        alias /var/www/jnnfactory/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /stock-api/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    if ($host = www.jnnfactory.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = jnnfactory.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name jnnfactory.online www.jnnfactory.online;
    return 404; # managed by Certbot
}
