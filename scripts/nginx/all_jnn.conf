server {
    listen 443 ssl;
    server_name jnnfactory.online www.jnnfactory.online;
    ssl_certificate /etc/letsencrypt/live/jnnfactory.online-0002/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jnnfactory.online-0002/privkey.pem; # managed by Certbot

    root /var/www/jnnfactory;

    # Быстрый переход в CMS
    location = /admin {
        return 301 https://admin.jnnfactory.online;
    }
    location = /admin/ {
        return 301 https://admin.jnnfactory.online;
    }

    index index.html;
    
    
    # Directus API proxy (public read)
    location ^~ /api/items/ {
        proxy_pass http://127.0.0.1:8055/items/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JNN Stock API Proxy
    location ^~ /api/stock/ {
        proxy_pass http://127.0.0.1:8095/api/v1/stock/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кастомная страница 404
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Служебные каталоги и скрытые файлы наружу не отдаём
    location ~ /\.(?!well-known) { return 404; }
    location ~* ^/(_scripts|scripts|backups|venv|reports|content|node_modules|screenshots)/ { return 404; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ ^/(media|pages|edit|save|settings|api)(\?.*)?$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }


    # API галереи изображений (FastAPI админки, порт 5000)
    location ^~ /gallery-api/ {
        proxy_pass http://127.0.0.1:5000/gallery-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128m;
    }

    # Файлы медиатеки Directus (uuid) отдаём на тот же путь /assets/,
    # что и статические картинки сайта. Regex-локация приоритетнее префикса.
    location ~* "^/assets/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # --- JNN: 301 pretty -> .html (устраняем дубли контента) ---
    # «Красивые» адреса без .html, у которых есть файл-двойник <slug>.html,
    # отдаём постоянным редиректом на версию с .html: так у поисковиков не
    # появляется второй адрес той же страницы. Если файла нет — поведение
    # прежнее (try_files -> 404), редиректов на несуществующее не создаём.
    # Локации стоят ПОСЛЕ прокси админки (media|pages|edit|save|settings|api),
    # поэтому админка и API не затрагиваются. Точное совпадение location = /admin
    # тоже имеет приоритет над этими регулярками.
    # Точные локации: редирект только для GET/HEAD, чтобы POST не превращался
    # в GET (для остальных методов статика отдаёт 405, как и раньше).
    location = /blog/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 301 /blog.html$is_args$args;
    }

    # Точные локации для страниц, файлы которых удалены: правило ниже требует
    # существующий файл-двойник <slug>.html, поэтому для них его не хватит.
    # Корневые дубли статьи «Футболки оптом» ведут на саму статью блога.
    location = /futbolki-optom {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 301 /blog/futbolki-optom-bishkek.html$is_args$args;
    }
    location = /futbolki-optom.html {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 301 /blog/futbolki-optom-bishkek.html$is_args$args;
    }
    location = /futbolki-optom-bishkek {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 301 /blog/futbolki-optom-bishkek.html$is_args$args;
    }
    location = /futbolki-optom-bishkek.html {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 301 /blog/futbolki-optom-bishkek.html$is_args$args;
    }

    # Дубль обложки блога: /blog/index(.html) -> /blog.html
    location = /blog/index {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 301 /blog.html$is_args$args;
    }
    location = /blog/index.html {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 301 /blog.html$is_args$args;
    }

    location ~ ^/(?<jnn_slug>[a-z0-9][a-z0-9_-]*)$ {
        # POST и прочие методы — как раньше: статику они не принимают (405),
        # редирект не должен превращать POST в GET.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        if (-f $document_root/$jnn_slug.html) {
            return 301 /$jnn_slug.html$is_args$args;
        }
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ ^/blog/(?<jnn_slug>[a-z0-9][a-z0-9_-]*)$ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        if (-f $document_root/blog/$jnn_slug.html) {
            return 301 /blog/$jnn_slug.html$is_args$args;
        }
        try_files $uri $uri.html $uri/ =404;
    }
    # --- /JNN: 301 pretty -> .html ---




    location /assets/ {
        alias /var/www/jnnfactory/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /stock-api/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }



}
server {
    if ($host = www.jnnfactory.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = jnnfactory.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name jnnfactory.online www.jnnfactory.online;
    return 404; # managed by Certbot




}
# --- 301: домен в зоне .ru (указан в PDF-каталоге) -> основной jnnfactory.online ---
server {
    listen 80;
    listen [::]:80;
    server_name jnnfactory.ru www.jnnfactory.ru;

    # ACME-челлендж Let's Encrypt отдаётся до редиректа
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://jnnfactory.online$request_uri;
    }
}

# --- 443 для .ru: постоянный редирект на основной домен (сертификат Let's Encrypt) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jnnfactory.ru www.jnnfactory.ru;

    ssl_certificate /etc/letsencrypt/live/jnnfactory.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jnnfactory.ru/privkey.pem;

    return 301 https://jnnfactory.online$request_uri;
}
